<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Campaigns</title>
        <link rel="stylesheet" href="../CSS/campaign.css">
        
    </head>
    <body>

        
        <nav class="light nav-animate-load" id="Nav">
            <label class="logo">
                <a href="../HTML/aboutus.html">
                <img src="../data/logo.png" ></a>
            </label>
            <div class="center-buttons container-animate-load">
                <a href="../HTML/home.html">
                        <button class="nav-btn" id="b0">Home</button>
                    </a>

                    <a href="../HTML/cities.html">
                        <button class="nav-btn" id="b1">Cities</button>
                    </a>
                    
                    <a href="../HTML/news.html">
                    <button class="nav-btn" id="b3">News</button>
                    </a>

                <button class="nav-btn" id="b4">Services</button>

                <button class="nav-btn" id="b6">User</button>
            </div>
            <label class="switch">
                <label class="flag">
                    <img src="../data/flag.png" alt="flag">
                </label>
            </label>
        </nav>
        
        <section class="campaign-hero">
        </section>

        <div class="tabs-wrapper">
            <button class="tab-btn active" onclick="switchCampaign(event, 'air')">Infrastructure Preservation</button>
            <button class="tab-btn" onclick="switchCampaign(event, 'waste')">Waste Management</button>
            <button class="tab-btn" onclick="switchCampaign(event, 'traffic')">Volenteeting</button>
            <button class="tab-btn" onclick="switchCampaign(event, 'bagmati')">River Health</button>
        </div>

        <div class="campaign-container">
            <div id="air" class="campaign-panel active-panel">
                <div class="split-grid" id="air-grid">
                    </div>
            </div>

            <div id="waste" class="campaign-panel">
                <div class="split-grid" id="waste-grid">
                    </div>
            </div>

            <div id="traffic" class="campaign-panel">
                <div class="split-grid" id="traffic-grid">
                    </div>
            </div>

            <div id="bagmati" class="campaign-panel">
                <div class="split-grid" id="bagmati-grid">
                    </div>
            </div>
        </div>
        <script src="../JS/campaign.js"></script>
    </body>
</html>
