<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Campaigns</title>
        <link rel="stylesheet" href="../CSS/campaign_admin.css">
        
    </head>
    <body>

        
        <nav class="light nav-animate-load" id="Nav">
            <label class="logo">
                <a href="../HTML/aboutus.html">
                <img src="../data/logo.png" ></a>
            </label>
            <div class="center-buttons container-animate-load">
                <a href="../HTML/home.html"><button class="nav-btn" id="b0">Home</button></a>
                <button class="nav-btn" id="b1">User</button>
                <button class="nav-btn" id="b3">Switch User</button>
                <button class="nav-btn" id="b4">Inquiry</button>
            </div>
            <label class="switch">
                <label class="flag">
                    <img src="../data/flag.png" alt="flag">
                </label>
            </label>
        </nav>

        <header><h1 id="ti">INPUT YOUR CAMPAIGN</h1></header>

        <div class="tabs-wrapper">
            <button class="tab-btn active" onclick="switchCampaign(event, 'air')">Infrastructure Preservation</button>
            <button class="tab-btn" onclick="switchCampaign(event, 'waste')">Waste Management</button>
            <button class="tab-btn" onclick="switchCampaign(event, 'traffic')">Volenteeting</button>
            <button class="tab-btn" onclick="switchCampaign(event, 'bagmati')">River Health</button>
        </div>
        <br>
        <form id="Inputing">
            <div id="Inputing-box">
                
                <label for="in-title">Title:</label>
                <input type="text" id="in-title" name="title">

                <label for="in-loca">Location:</label>
                <input type="text" id="in-loca" name="location">

                <label for="in-comp">Institution:</label>
                <input type="text" id="in-comp" name="institution">

                <label for="in-des">Description:</label>
                <textarea id="in-des" name="description" rows="5"></textarea>

                <label for="in-link">Link:</label>
                <input type="url" id="in-link" name="link">

                <button type="submit">Submit</button>
            </div>
        </form>
        <script src="../JS/campaign_admin.js"></script>
    </body>
</html>
