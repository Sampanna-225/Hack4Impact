    <header id="navi" >
        <nav class="light nav-animate-load" id="Nav">
            <label class="logo">
                <a href="../HTML/aboutus.html">
                <img src="../data/logo.png" ></a>
            </label>
            <div class="center-buttons container-animate-load">
                <a href="../HTML/home.html"><button class="nav-btn" id="b0">Home</button></a>
                  <div class="nav-item-dropdown">
                        <button class="nav-btn" id="b6">User</button>
                        
                        <div class="mega-menu">
                            <div class="mega-menu-content">
                                <div class="mega-menu-column">
                                    <h3>Explore Services</h3>
                                    <a href="../HTML/User.html">User Login</a>
                                    <a href="../HTML/campaign_admin.html">User Admin Mode</a>
                                    <a href="../HTML/heritages.html">Sign Out</a>
                                </div>
                                
                                <div class="mega-menu-column">
                                    <h3>Support</h3>
                                    <a href="../HTML/aboutus.html">Creator's Detail</a>
                                    <a href="https://www.instagram.com/og_denkg">Report an Issue</a>

                                </div>
                            </div>
                        </div>
                    </div>
            </div>
            <label class="switch">
                <label class="flag">
                    <img src="../data/flag.png" alt="flag">
                </label>
            </label>
        </nav>
        </header>

        
        <header><h1 id="ti">INPUT YOUR CAMPAIGN</h1></header>
        <div class="main-workspace"></div>
        <div class="tabs-wrapper">
            <button class="tab-btn active" onclick="switchCampaign(event, 'air')">Infrastructure Preservation</button>
            <button class="tab-btn" onclick="switchCampaign(event, 'waste')">Waste Management</button>
            <button class="tab-btn" onclick="switchCampaign(event, 'traffic')">All Categories</button>
            <button class="tab-btn" onclick="switchCampaign(event, 'bagmati')">River Health</button>
        </div>
        <br>
        
        <div class="campaign-container">
            <form id="Inputing" onsubmit="input(event)">
                <input type="hidden" id="in-category" value="air">
                
                <div id="Inputing-box">
                    <label for="in-title">Title:</label>
                    <input type="text" id="in-title" name="title" placeholder="Enter campaign title">

                    <label for="in-loca">Location:</label>
                    <input type="text" id="in-loca" name="location" placeholder="e.g. Kathmandu, Nepal">

                    <label for="in-comp">Institution:</label>
                    <input type="text" id="in-comp" name="institution" placeholder="NGO or Organization name">

                    <label for="in-des">Description:</label>
                    <textarea id="in-des" name="description" rows="5" placeholder="Describe the objectives..."></textarea>

                    <label for="in-link">Link:</label>
                    <input type="url" id="in-link" name="link" placeholder="https://example.com/apply">

                    <button type="submit">Submit Campaign</button>
                </div>
            </form>
            <footer>
                <p>© 2026 Sustainable Cities And Communities </p>
            </footer>
        </div></div>

        <script src="../JS/campaign_admin.js"></script>
    </body>
</html>
