
<style>
  @keyframes borderGlow {
    0%, 100% { box-shadow: 0 0 8px 2px rgba(220,30,30,0.7), 0 0 16px 4px rgba(60,60,200,0.4); }
    50% { box-shadow: 0 0 12px 4px rgba(60,60,200,0.7), 0 0 20px 6px rgba(220,30,30,0.4); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }
  .banner-wrap {
    background: linear-gradient(135deg, #1a0005 0%, #0a0020 50%, #1a0005 100%);
    border-radius: 14px;
    border: 2px solid transparent;
    background-clip: padding-box;
    animation: borderGlow 3s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    height: 100px;
    gap: 1rem;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  .banner-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(200,0,0,0.12) 0%, rgba(0,0,180,0.12) 100%);
    pointer-events: none;
  }
  .logo-box {
    width: 72px;
    height: 72px;
    border-radius: 10px;
    border: 1.5px dashed rgba(255,100,100,0.5);
    background: rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    gap: 5px;
  }
  .cta-btn {
    white-space: nowrap;
    background: linear-gradient(90deg, #cc1111 0%, #3333cc 100%);
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 11px 26px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    letter-spacing: 0.02em;
    animation: pulse 2.5s ease-in-out infinite;
    box-shadow: 0 0 10px rgba(200,0,0,0.5), 0 0 10px rgba(0,0,200,0.3);
  }
</style>

<div style="padding: 1.5rem 0;">
  <h2 class="sr-only">Leaderboard advertisement banner — red and blue theme</h2>

  <p style="font-size: 12px; color: var(--color-text-tertiary); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.08em;">Leaderboard banner — red &amp; blue theme</p>

  <div class="banner-wrap">
    <!-- Logo placeholder -->
    <div class="logo-box">
      <i class="ti ti-photo" style="font-size: 26px; color: rgba(255,120,120,0.75);" aria-hidden="true"></i>
      <span style="font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 0.06em; text-align: center; line-height: 1.3;">Insert<br>Logo</span>
    </div>

    <!-- Text -->
    <div style="flex: 1; min-width: 0;">
      <p style="margin: 0 0 4px; font-size: 20px; font-weight: 500; color: #fff; line-height: 1.2;">Your advertisement here</p>
      <p style="margin: 0; font-size: 13px; color: rgba(180,180,255,0.85);">Reach thousands of visitors every day</p>
    </div>

    <!-- CTA only -->
    <div style="flex-shrink: 0;">
      <a href="#" onclick="return false;" class="cta-btn">Contact us</a>
    </div>
  </div>

  <div style="display: flex; gap: 10px; margin-top: 1.25rem; flex-wrap: wrap;">
    <button onclick="sendPrompt('Change the headline text on the red and blue leaderboard banner')" style="font-size: 13px; cursor: pointer; padding: 8px 16px; border-radius: var(--border-radius-md);">Change headline ↗</button>
    <button onclick="sendPrompt('Add a tagline and phone number to the red and blue leaderboard banner')" style="font-size: 13px; cursor: pointer; padding: 8px 16px; border-radius: var(--border-radius-md);">Add tagline + phone ↗</button>
    <button onclick="sendPrompt('Export the red and blue leaderboard banner as a standalone HTML file')" style="font-size: 13px; cursor: pointer; padding: 8px 16px; border-radius: var(--border-radius-md);">Export as HTML ↗</button>
  </div>
</div>
